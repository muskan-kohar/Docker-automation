events {}
#consistent -> minimize redistribution
#$X_User_ID is used as hashing keyy
http {
    upstream servers{
        hash $http_x_user_id consistent;
        server backend_server1:8000;
        server backend_server2:8000;
        server backend_server3:8000;
    }


    server{
        listen 80;
        location /{
            proxy_pass http://servers;
        }
    }
}